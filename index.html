<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM MART - Secure Checkout</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            text-align: center;
            box-sizing: border-box;
            margin: 20px;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 14px;
            color: #d93025; /* Noticeable alert color indicating action is required */
            font-weight: 600;
            margin-bottom: 35px;
            line-height: 1.5;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-review {
            background-color: #1e8e3e;
            color: white;
            box-shadow: 0 4px 12px rgba(30, 142, 62, 0.2);
        }
        .btn-pay {
            background-color: #0052cc;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 82, 204, 0.2);
            display: none; /* Hard-locked hidden layer */
        }
        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #a0a0a0;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">CM MART</div>
    
    <!-- Locked Initial Subtitle -->
    <div id="statusText" class="subtitle">
        ⚠️ Action Required:<br>Please support us with a Google Review to unlock the UPI payment option.
    </div>
    
    <!-- Mandatory Action Button -->
    <button id="reviewBtn" class="btn btn-review" onclick="unlockPaymentGate()">
        ⭐ Rate Us on Google & Unlock Payment
    </button>
    
    <!-- Locked Payment Link Element -->
    <a id="payBtn" href="upi://pay?pa=8688051752@hdfc&pn=Construction%20Material%20Mart" class="btn btn-pay">
        💸 Proceed to UPI Payment
    </a>
    
    <div class="footer">🔒 Secure UPI Link Connection</div>
</div>

<script>
    function unlockPaymentGate() {
        // 1. Force route the customer straight into your active Google Review form page
        window.open("https://g.page", "_blank");
        
        // 2. Erase the review button entirely so it cannot be clicked again
        document.getElementById("reviewBtn").style.display = "none";
        
        // 3. Swap text to success styling
        const statusText = document.getElementById("statusText");
        statusText.style.color = "#1e8e3e";
        statusText.innerHTML = "🎉 Thank you for supporting CM MART!<br>Payment portal is now completely unlocked.";
        
        // 4. Reveal the operational payment gateway button
        document.getElementById("payBtn").style.display = "flex";
    }
</script>

</body>
</html>
